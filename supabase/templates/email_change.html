<h2>Подтвердите почту для «Тадара»</h2>
<p>Код подтверждения:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px">{{ .Token }}</p>
<p>Введите его в приложении (Настройки → Аккаунт) — или откройте ссылку на этом же устройстве:</p>
<p><a href="{{ .ConfirmationURL }}">Подтвердить {{ .NewEmail }}</a></p>
<p>Если вы не привязывали почту к «Тадару», просто проигнорируйте это письмо.</p>
